<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        * {
            margin: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .login {
            max-width: 300px;
            height: 350px;
            margin: 25vh auto;
            border: 1px solid black;
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
            0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .login:hover {
        transform: translateY(-6px);
        box-shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.1), 
        0 12px 18px -5px rgba(0, 0, 0, 0.06);
        }

        .formnya {
            width: 100%;
            padding: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 3vh;
        }

        h3 {
            text-align: center;
            margin: 10px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid;
        }

        .tombol {
            width: 100%;
            padding: 5px;
            max-width: 100px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 10px;
        }

        .garis {
            display: flex;
            text-align: center;
            align-items: center;
            font-weight: bold;
            margin: 15px auto;
        }

        .garis::before,
        .garis::after {
            content: "";
            flex: 1;
            border-bottom: 2px solid #ccc;
        }

        .garis::before {
            margin-right: 2px;
        }

        .garis::after {
            margin-left: 2px;
        }

        ul {
           list-style-type: none;
           display: flex;
           gap: 15px;
        }

        li img {
        text-decoration: none;
        width: 25px;
        }

        .error-input {
        border-color: red !important;
        background-color: #ffe6e6 !important;
        }

        p[id^="wrong"] {
        color: red;
        font-size: 12px;
        margin-top: 4px;
        }

    </style>

</head>

<body>



<div class="login">
<form action="" class="formnya">

<h2>Sign up</h2>

<input type="text" id="input-nama" placeholder="Ketik username kamu...">

<p id="wrong1"></p>

<br><br>

<input type="password" id="input-hobi" placeholder="Ketik password kamu...">

<p id="wrong2"></p>

<br><br>

<button id="btn-buat" class="tombol">Daftar</button>

<a href="index.html" class="link">Have already an account?</a>

</form>
</div>

<script>

    let btn1 = document.getElementById('btn-buat');

    let input1 = document.getElementById('input-nama');

    let input2 = document.getElementById('input-hobi');

    let salah1 = document.getElementById('wrong1');

    let salah2 = document.getElementById('wrong2');

    function validasiInput(inputElemen,errorElemen,minKarakter) {

        if(inputElemen.value === ''){
            errorElemen.textContent = 'Kolom tidak boleh kosong'
            inputElemen.classList.add('error-input')
            return false

        } else if(inputElemen.value.length < minKarakter){
            errorElemen.textContent = 'Input terlalu pendek'
            inputElemen.classList.add('error-input')
            return false

        } else {
            errorElemen.textContent = ''
            inputElemen.classList.remove('error-input')
            return true
        }

    }

    btn1.addEventListener('click',function(event) {

        event.preventDefault();

        let cek1 = validasiInput(input1,salah1,8)

        let cek2 = validasiInput(input2,salah2,8)

        if(cek1 && cek2){

            console.log('berhasil')

        }
 
    });

   </script>

</body>
</html>
